<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Splitter | J-Tools</title>
    <!-- JSZip Library allows us to bundle images into a downloadable zip file entirely in the browser -->
    <script src="https://cloudflare.com"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #121214;
            color: #f5f5f7;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 800px;
            width: 100%;
            background: #1a1a1e;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        a.back-link {
            color: #86868b;
            text-decoration: none;
            font-size: 0.9rem;
            display: inline-block;
            margin-bottom: 20px;
        }
        a.back-link:hover { color: #0071e3; }
        h1 { margin-top: 0; }
        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }
        label {
            display: flex;
            flex-direction: column;
            font-size: 0.85rem;
            color: #86868b;
        }
        input {
            background: #2a2a30;
            border: 1px solid #3a3a40;
            color: white;
            padding: 10px;
            border-radius: 6px;
            margin-top: 5px;
        }
        button {
            background: #0071e3;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
        }
        button:hover { background: #0077ed; }
        button:disabled { background: #333; color: #666; cursor: not-allowed; }
        #previewGrid {
            display: grid;
            gap: 4px;
            margin-top: 25px;
            background: #2a2a30;
            padding: 10px;
            border-radius: 8px;
        }
        .tile-preview {
            width: 100%;
            height: auto;
            border: 1px dashed #555;
        }
    </style>
</head>
<body>

    <div class="container">
        <a href="index.html" class="back-link">← Back to J-Tools</a>
        <h1>✂️ Image Splitter</h1>
        
        <label>Select Image
            <input type="file" id="imageInput" accept="image/*">
        </label>

        <div class="controls">
            <label>Rows
                <input type="number" id="rowsInput" value="3" min="1" max="10">
            </label>
            <label>Columns
                <input type="number" id="colsInput" value="3" min="1" max="10">
            </label>
        </div>

        <button id="processBtn" disabled>Split & Download Images (.ZIP)</button>

        <div id="previewGrid"></div>
    </div>

    <script>
        const imageInput = document.getElementById('imageInput');
        const rowsInput = document.getElementById('rowsInput');
        const colsInput = document.getElementById('colsInput');
        const processBtn = document.getElementById('processBtn');
        const previewGrid = document.getElementById('previewGrid');

        let sourceImage = null;

        // Handle image selection
        imageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                sourceImage = new Image();
                sourceImage.onload = () => {
                    processBtn.disabled = false;
                };
                sourceImage.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        // Split image and package into ZIP
        processBtn.addEventListener('click', async () => {
            if (!sourceImage) return;

            const rows = parseInt(rowsInput.value);
            const cols = parseInt(colsInput.value);
            
            // Clear prior previews
            previewGrid.innerHTML = '';
            previewGrid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;

            const tileWidth = sourceImage.width / cols;
            const tileHeight = sourceImage.height / rows;

            const zip = new JSZip();
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');

            canvas.width = tileWidth;
            canvas.height = tileHeight;

            // Generate tiles
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    ctx.clearRect(0, 0, tileWidth, tileHeight);
                    
                    // Slice section out of the source image
                    ctx.drawImage(
                        sourceImage,
                        c * tileWidth, r * tileHeight, tileWidth, tileHeight, // Source window
                        0, 0, tileWidth, tileHeight                          // Destination canvas
                    );

                    // Add to screen preview
                    const imgUrl = canvas.toDataURL('image/png');
                    const imgElement = document.createElement('img');
                    imgElement.src = imgUrl;
                    imgElement.className = 'tile-preview';
                    previewGrid.appendChild(imgElement);

                    // Convert canvas to binary blob and add to ZIP packet
                    const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
                    zip.file(`tile_row${r+1}_col${c+1}.png`, blob);
                }
            }

            // Export zip file automatically
            zip.generateAsync({type: "blob"}).then((content) => {
                const link = document.createElement('a');
                link.href = URL.createObjectURL(content);
                link.download = "jtools_split_images.zip";
                link.click();
            });
        });
    </script>
</body>
</html>
