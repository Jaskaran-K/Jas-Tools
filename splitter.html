<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Image Splitter | J-Tools</title>
    <!-- We only need JSZip to create the downloadable bundle -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root {
            --bg-color: #121214;
            --card-bg: #1a1a1e;
            --text-color: #f5f5f7;
            --accent-color: #0071e3;
            --accent-hover: #0077ed;
            --success-color: #34c759;
            --border-color: #2a2a30;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 1000px;
            width: 100%;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }
        a.back-link {
            color: #86868b;
            text-decoration: none;
            font-size: 0.9rem;
            display: inline-block;
            margin-bottom: 20px;
        }
        a.back-link:hover { color: var(--accent-color); }
        h1 { margin-top: 0; font-size: 2rem; }
        
        .workspace {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 25px;
            margin-top: 20px;
        }
        @media (max-width: 800px) {
            .workspace { grid-template-columns: 1fr; }
        }

        .panel-controls {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            font-size: 0.85rem;
            color: #86868b;
        }
        .control-group input[type="number"], .control-group input[type="file"] {
            background: #2a2a30;
            border: 1px solid #3a3a40;
            color: white;
            padding: 10px;
            border-radius: 6px;
            margin-top: 5px;
        }
        .canvas-area {
            background: #09090b;
            border: 2px dashed var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 500px;
        }
        canvas {
            display: block;
            cursor: crosshair;
        }
        .canvas-hint {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.75rem;
            color: #86868b;
            pointer-events: none;
        }

        button {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: var(--accent-hover); }
        button:disabled { background: #333; color: #666; cursor: not-allowed; }
        
        .preview-section {
            margin-top: 40px;
            border-top: 1px solid var(--border-color);
            padding-top: 30px;
            display: none;
        }
        .preview-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
        }
        .tile-card {
            background: #2a2a30;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid transparent;
            cursor: pointer;
            position: relative;
            transition: all 0.2s ease;
        }
        .tile-card img {
            width: 100%;
            display: block;
            height: auto;
            background: #111;
        }
        .tile-card.selected {
            border-color: var(--success-color);
            box-shadow: 0 0 10px rgba(52, 199, 89, 0.3);
        }
        .checkbox-indicator {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: rgba(0,0,0,0.6);
            border: 2px solid white;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .tile-card.selected .checkbox-indicator {
            background: var(--success-color);
            border-color: var(--success-color);
        }
        .tile-card.selected .checkbox-indicator::after {
            content: '✓';
            color: white;
            font-size: 11px;
            font-weight: bold;
        }
        .download-bar {
            margin-top: 25px;
            display: flex;
            justify-content: flex-end;
        }
    </style>
</head>
<body>

    <div class="container">
        <a href="index.html" class="back-link">← Back to J-Tools</a>
        <h1>✂️ Advanced Image Splitter</h1>
        
        <div class="workspace">
            <div class="panel-controls">
                <div class="control-group">
                    <label for="imageInput">Upload Source Image</label>
                    <input type="file" id="imageInput" accept="image/*">
                </div>

                <div class="control-group">
                    <label for="rowsInput">Rows (Horizontal Splits)</label>
                    <input type="number" id="rowsInput" value="3" min="1" max="20" disabled>
                </div>

                <div class="control-group">
                    <label for="colsInput">Columns (Vertical Splits)</label>
                    <input type="number" id="colsInput" value="3" min="1" max="20" disabled>
                </div>

                <button id="previewSplitBtn" disabled>Preview Split Sections</button>
            </div>

            <div class="canvas-area" id="canvasContainer">
                <canvas id="mainCanvas"></canvas>
                <div class="canvas-hint" id="canvasHint" style="display:none;">
                    Scroll to Zoom | Hold Space/Alt + Drag to Pan | Drag Lines to Customize
                </div>
            </div>
        </div>

        <div class="preview-section" id="previewSection">
            <div class="preview-header">
                <h2>Select Tiles to Keep</h2>
                <span id="selectionCount" style="color:#86868b;">0 tiles selected</span>
            </div>
            <div class="gallery-grid" id="galleryGrid"></div>
            <div class="download-bar">
                <button id="downloadBtn" style="background-color: var(--success-color);">Download Selected Pack (.ZIP)</button>
            </div>
        </div>
    </div>

    <script>
        const imageInput = document.getElementById('imageInput');
        const rowsInput = document.getElementById('rowsInput');
        const colsInput = document.getElementById('colsInput');
        const previewSplitBtn = document.getElementById('previewSplitBtn');
        const canvasContainer = document.getElementById('canvasContainer');
        const canvasHint = document.getElementById('canvasHint');
        const previewSection = document.getElementById('previewSection');
        const galleryGrid = document.getElementById('galleryGrid');
        const selectionCountText = document.getElementById('selectionCount');
        const downloadBtn = document.getElementById('downloadBtn');

        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');

        let img = null;
        let zoom = 1;
        let panX = 0;
        let panY = 0;
        let isDragging = false;
        let startX, startY;
        let isSpacePressed = false;
        let isAltPressed = false;

        // Line handles (stored in normalized image pixel coordinates 0 to img.width / img.height)
        let xSplits = []; // absolute original image pixels
        let ySplits = [];

        let activeLine = null; // { type: 'h'|'v', index: number }
        const lineHitTolerance = 8; // clickable window around line in screen pixels

        function initCanvasSize() {
            canvas.width = canvasContainer.clientWidth;
            canvas.height = 500;
            draw();
        }
        window.addEventListener('resize', initCanvasSize);
        initCanvasSize();

        // Listen for spacebar or Alt key to toggle pan state
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') { isSpacePressed = true; canvas.style.cursor = 'grab'; e.preventDefault(); }
            if (e.altKey) { isAltPressed = true; canvas.style.cursor = 'grab'; }
        });
        window.addEventListener('keyup', (e) => {
            if (e.code === 'Space') { isSpacePressed = false; updateCursor(); }
            if (e.code === 'AltLeft' || e.code === 'AltRight') { isAltPressed = false; updateCursor(); }
        });

        function updateCursor() {
            if (isSpacePressed || isAltPressed) {
                canvas.style.cursor = 'grab';
            } else {
                canvas.style.cursor = 'crosshair';
            }
        }

        imageInput.addEventListener('change', (e) => {
            const files = e.target.files;
            if (!files || files.length === 0) return;

            const reader = new FileReader();
            reader.onload = (f) => {
                img = new Image();
                img.onload = () => {
                    // Reset zoom & transform to center image fit
                    zoom = Math.min(canvas.width / img.width, canvas.height / img.height, 1);
                    panX = (canvas.width - img.width * zoom) / 2;
                    panY = (canvas.height - img.height * zoom) / 2;

                    rowsInput.disabled = false;
                    colsInput.disabled = false;
                    previewSplitBtn.disabled = false;
                    canvasHint.style.display = 'block';

                    resetSplitLines();
                    draw();
                };
                img.src = f.target.result;
            };
            reader.readAsDataURL(files[0]);
        });

        function resetSplitLines() {
            if (!img) return;
            const rCount = parseInt(rowsInput.value) || 1;
            const cCount = parseInt(colsInput.value) || 1;

            xSplits = [];
            ySplits = [];

            for (let i = 1; i < cCount; i++) {
                xSplits.push((img.width / cCount) * i);
            }
            for (let j = 1; j < rCount; j++) {
                ySplits.push((img.height / rCount) * j);
            }
        }

        rowsInput.addEventListener('input', () => { resetSplitLines(); draw(); });
        colsInput.addEventListener('input', () => { resetSplitLines(); draw(); });

        // Transform screen coords to original image pixels
        function screenToImageCoords(sx, sy) {
            const ix = (sx - panX) / zoom;
            const iy = (sy - panY) / zoom;
            return { x: ix, y: iy };
        }

        // Transform image coords back to screen coords
        function imageToScreenCoords(ix, iy) {
            const sx = ix * zoom + panX;
            const sy = iy * zoom + panY;
            return { x: sx, y: sy };
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (!img) return;

            // Draw image with active zoom/pan transformation matrix
            ctx.save();
            ctx.translate(panX, panY);
            ctx.scale(zoom, zoom);
            ctx.drawImage(img, 0, 0);
            ctx.restore();

            // Draw splitting grid lines on top using clear overlay coordinates
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#0071e3';

            // Vertical splits
            xSplits.forEach((x) => {
                const topPt = imageToScreenCoords(x, 0);
                const botPt = imageToScreenCoords(x, img.height);
                ctx.beginPath();
                ctx.moveTo(topPt.x, topPt.y);
                ctx.lineTo(botPt.x, botPt.y);
                ctx.stroke();
            });

            // Horizontal splits
            ySplits.forEach((y) => {
                const leftPt = imageToScreenCoords(0, y);
                const rightPt = imageToScreenCoords(img.width, y);
                ctx.beginPath();
                ctx.moveTo(leftPt.x, leftPt.y);
                ctx.lineTo(rightPt.x, rightPt.y);
                ctx.stroke();
            });
        }

        // Mouse interaction logic
        canvas.addEventListener('mousedown', (e) => {
            if (!img) return;
            const rect = canvas.getBoundingClientRect();
            startX = e.clientX - rect.left;
            startY = e.clientY - rect.top;

            if (isSpacePressed || isAltPressed || e.button === 1) {
                isDragging = true;
                if (isSpacePressed || isAltPressed) canvas.style.cursor = 'grabbing';
                return;
            }

            // Check if user hit a line instead
            const imgMouse = screenToImageCoords(startX, startY);

            // Find nearest line
            let clickedLine = null;
            let minDist = lineHitTolerance;

            xSplits.forEach((x, idx) => {
                const screenX = imageToScreenCoords(x, 0).x;
                const d = Math.abs(startX - screenX);
                if (d < minDist) {
                    minDist = d;
                    clickedLine = { type: 'v', index: idx };
                }
            });

            ySplits.forEach((y, idx) => {
                const screenY = imageToScreenCoords(0, y).y;
                const d = Math.abs(startY - screenY);
                if (d < minDist) {
                    minDist = d;
                    clickedLine = { type: 'h', index: idx };
                }
            });

            if (clickedLine) {
                activeLine = clickedLine;
            } else {
                // Otherwise normal map pan action if mouse drag starts elsewhere
                isDragging = true;
            }
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!img) return;
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            if (activeLine) {
                const imgMouse = screenToImageCoords(mouseX, mouseY);
                if (activeLine.type === 'v') {
                    // Restrict dragging to stay within image canvas bounds cleanly
                    xSplits[activeLine.index] = Math.max(0, Math.min(img.width, imgMouse.x));
                } else {
                    ySplits[activeLine.index] = Math.max(0, Math.min(img.height, imgMouse.y));
                }
                draw();
                return;
            }

            if (isDragging) {
                panX += mouseX - startX;
                panY += mouseY - startY;
                startX = mouseX;
                startY = mouseY;
                draw();
                return;
            }

            // Hover effects over active cursor points
            const imgMouse = screenToImageCoords(mouseX, mouseY);
            let hoverLine = null;
            let minDist = lineHitTolerance;

            xSplits.forEach((x) => {
                const screenX = imageToScreenCoords(x, 0).x;
                const d = Math.abs(mouseX - screenX);
                if (d < minDist) { minDist = d; hoverLine = 'v'; }
            });

            ySplits.forEach((y) => {
                const screenY = imageToScreenCoords(0, y).y;
                const d = Math.abs(mouseY - screenY);
                if (d < minDist) { minDist = d; hoverLine = 'h'; }
            });

            if (isSpacePressed || isAltPressed) {
                canvas.style.cursor = isDragging ? 'grabbing' : 'grab';
            } else if (hoverLine === 'v') {
                canvas.style.cursor = 'ew-resize';
            } else if (hoverLine === 'h') {
                canvas.style.cursor = 'ns-resize';
            } else {
                canvas.style.cursor = 'crosshair';
            }
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
            activeLine = null;
            updateCursor();
        });

        // Wheel Zoom Action
        canvas.addEventListener('wheel', (e) => {
            if (!img) return;
            e.preventDefault();

            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            // Anchor screen scaling points around mouse center position
            const zoomFactor = e.deltaY < 0 ? 1.1 : 0.9;
            const nextZoom = Math.max(0.05, Math.min(50, zoom * zoomFactor));

            // Shift pan coordinates appropriately to preserve mouse lock layer points
            panX = mouseX - (mouseX - panX) * (nextZoom / zoom);
            panY = mouseY - (mouseY - panY) * (nextZoom / zoom);
            zoom = nextZoom;

            draw();
        }, { passive: false });


        // Generate splits
        let generatedTilesData = [];

        previewSplitBtn.addEventListener('click', () => {
            if (!img) return;

            galleryGrid.innerHTML = '';
            generatedTilesData = [];

            // Sort arrays numerically and insert edges
            let xCuts = [...xSplits].sort((a,b) => a-b);
            let yCuts = [...ySplits].sort((a,b) => a-b);

            xCuts.unshift(0); xCuts.push(img.width);
            yCuts.unshift(0); yCuts.push(img.height);

            const scratchCanvas = document.createElement('canvas');
            const scratchCtx = scratchCanvas.getContext('2d');

            let segmentIndex = 1;

            for (let r = 0; r < yCuts.length - 1; r++) {
                for (let c = 0; c < xCuts.length - 1; c++) {
                    const sX = xCuts[c];
                    const sY = yCuts[r];
                    const sW = xCuts[c+1] - sX;
                    const sH = yCuts[r+1] - sY;

                    if (sW <= 1 || sH <= 1) continue;

                    scratchCanvas.width = sW;
                    scratchCanvas.height = sH;
                    scratchCtx.clearRect(0, 0, sW, sH);
                    scratchCtx.drawImage(img, sX, sY, sW, sH, 0, 0, sW, sH);

                    const dataUrl = scratchCanvas.toDataURL('image/png');

                    const card = document.createElement('div');
                    card.className = 'tile-card selected';
                    card.dataset.index = segmentIndex;

                    const tileImg = document.createElement('img');
                    tileImg.src = dataUrl;

                    const indicator = document.createElement('div');
                    indicator.className = 'checkbox-indicator';

                    card.appendChild(tileImg);
                    card.appendChild(indicator);
                    galleryGrid.appendChild(card);

                    generatedTilesData.push({
                        id: segmentIndex,
                        dataUrl: dataUrl,
                        selected: true,
                        filename: `tile_row${r+1}_col${c+1}.png`
                    });

                    card.addEventListener('click', function() {
                        const tileId = parseInt(this.dataset.index);
                        const match = generatedTilesData.find(t => t.id === tileId);
                        match.selected = !match.selected;

                        if (match.selected) {
                            this.classList.add('selected');
                        } else {
                            this.classList.remove('selected');
                        }
                        updateSelectionCounter();
                    });

                    segmentIndex++;
                }
            }

            previewSection.style.display = 'block';
            updateSelectionCounter();
            previewSection.scrollIntoView({ behavior: 'smooth' });
        });

        function updateSelectionCounter() {
            const totalSelected = generatedTilesData.filter(t => t.selected).length;
            selectionCountText.innerText = `${totalSelected} of ${generatedTilesData.length} tiles selected`;
            downloadBtn.disabled = totalSelected === 0;
        }

        downloadBtn.addEventListener('click', async () => {
            const activeTiles = generatedTilesData.filter(t => t.selected);
            if (activeTiles.length === 0) return;

            downloadBtn.innerText = "Bundling ZIP archive...";
            downloadBtn.disabled = true;

            const zip = new JSZip();

            for (const tile of activeTiles) {
                const response = await fetch(tile.dataUrl);
                const blob = await response.blob();
                zip.file(tile.filename, blob);
            }

            zip.generateAsync({ type: 'blob' }).then((content) => {
                const link = document.createElement('a');
                link.href = URL.createObjectURL(content);
                link.download = "jtools_split_manifest.zip";
                link.click();

                downloadBtn.innerText = "Download Selected Pack (.ZIP)";
                downloadBtn.disabled = false;
            });
        });
    </script>
</body>
</html>
