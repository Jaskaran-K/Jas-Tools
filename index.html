<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J-Tools | Online Utilities</title>
    <style>
        :root {
            --bg-color: #121214;
            --card-bg: #1a1a1e;
            --text-color: #f5f5f7;
            --accent-color: #0071e3;
            --accent-hover: #0077ed;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            text-align: center;
            margin-bottom: 50px;
        }
        h1 {
            font-size: 3rem;
            margin: 0 0 10px 0;
            background: linear-gradient(135deg, #fff 0%, #888 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            color: #86868b;
            font-size: 1.2rem;
            margin: 0;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            max-width: 1000px;
            width: 100%;
        }
        .card {
            background-color: var(--card-bg);
            border: 1px solid #2a2a30;
            border-radius: 14px;
            padding: 25px;
            text-decoration: none;
            color: inherit;
            transition: transform 0.2s ease, border-color 0.2s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-color);
        }
        .card h2 {
            margin: 0 0 12px 0;
            font-size: 1.4rem;
        }
        .card p {
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 20px;
        }
        .btn {
            background-color: var(--accent-color);
            color: white;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            text-align: center;
            align-self: flex-start;
        }
        .card:hover .btn {
            background-color: var(--accent-hover);
        }
    </style>
</head>
<body>

    <header>
        <h1>J-Tools</h1>
        <p>A collection of simple, fast, client-side web tools.</p>
    </header>

    <main class="grid">
        <!-- Tool 1: Image Splitter -->
        <a href="splitter.html" class="card">
            <div>
                <h2>✂️ Image Splitter</h2>
                <p>Slice a large image into a grid of smaller pieces rows and columns. Perfect for social media grids.</p>
            </div>
            <div class="btn">Open Tool</div>
        </a>

        <!-- Placeholder for your next tool -->
        <div class="card" style="opacity: 0.5; cursor: not-allowed; border-style: dashed;">
            <div>
                <h2>🖼️ Image Editor</h2>
                <p>Coming soon! Crop, filter, and modify images instantly in your browser.</p>
            </div>
            <div class="btn" style="background-color: #333;">Locked</div>
        </div>
    </main>

</body>
</html>
